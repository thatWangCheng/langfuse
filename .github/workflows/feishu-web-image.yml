name: Feishu web image

# Builds the linux/amd64 web image of this branch and uploads it as an
# artifact (docker-save tarball). It is copied to the private registry from
# outside GitHub, so no registry credentials live in this repository.
on:
  push:
    branches: [codex/feishu-login]
    paths-ignore: ["**.md"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          platforms: linux/amd64
          build-args: NEXT_PUBLIC_BUILD_ID=${{ github.sha }}
          tags: langfuse-web:${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/langfuse-web.tar
      - run: gzip -1 "$RUNNER_TEMP/langfuse-web.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: langfuse-web-${{ github.sha }}
          path: ${{ runner.temp }}/langfuse-web.tar.gz
          compression-level: 0
          retention-days: 3
